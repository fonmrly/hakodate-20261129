<!-- app-version:v5-no-double-gate -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a4f"><title>函館旅のしおり</title>
<style>
:root{--navy:#102a4f;--paper:#f4ead2;--gold:#d0a84a;--gold2:#f4d67a;--brick:#8d342d;--muted:#756b5b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#254d78 0,#102a4f 42%,#09182d 100%);color:#25211c}
.card{width:min(440px,100%);overflow:hidden;border:1px solid rgba(244,214,122,.9);border-radius:22px;background:var(--paper);box-shadow:0 24px 80px rgba(0,0,0,.5)}
.art{padding:30px 24px 22px;color:white;background:linear-gradient(150deg,#17365e,#102a4f)}
.art:before{content:"✦  北の冒険へ  ✦";display:block;color:var(--gold2);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px;letter-spacing:.14em}
h1{margin:10px 0 4px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#fff7da;font-size:36px;line-height:1.08}.sub{margin:0;color:#dce9f4;font-size:13px;line-height:1.7}
.form{padding:22px}.form label{display:block;margin-bottom:8px;color:var(--muted);font-size:12px}.row{display:flex;gap:8px}
input{min-width:0;flex:1;border:1px solid #cdbf9d;border-radius:12px;background:#fffaf0;padding:13px 14px;font-size:17px;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(208,168,74,.18)}
button{border:0;border-radius:12px;background:var(--navy);color:white;padding:12px 17px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #08192e}button:disabled{opacity:.55}
.msg{min-height:1.5em;margin:10px 0 0;color:var(--brick);font-size:12px}.note{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
</style></head>
<body><main class="card"><section class="art"><h1>函館旅のしおり</h1><p class="sub">2026.11.28 — 11.30<br>のんびり函館 × ゴールデンカムイ気分</p></section>
<section class="form"><form id="f"><label for="p">旅の仲間の合言葉（日本語OK）</label><div class="row"><input id="p" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="おいしい…" required><button id="b">ひらく</button></div><p class="msg" id="m"></p></form><p class="note">予定・食事・旅費・写真は2人の端末で共有されます。</p></section></main>
<script>
(()=>{
const API="https://bvmumhpylsllbvhvymns.supabase.co/functions/v1/hakodate-trip-202611",f=document.getElementById("f"),p=document.getElementById("p"),m=document.getElementById("m"),b=document.getElementById("b");
f.addEventListener("submit",async e=>{e.preventDefault();b.disabled=true;m.textContent="確認中…";try{
 const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",passphrase:p.value.trim()})});
 if(!r.ok){m.textContent=r.status===401?"合言葉が違います。":"接続できませんでした。";b.disabled=false;p.select();return}
 const j=await r.json();sessionStorage.setItem("hk:token",j.token);document.open();document.write(j.html);document.close();
}catch(err){m.textContent="接続できませんでした。もう一度お試しください。";b.disabled=false}});
})();
</script></body></html>
