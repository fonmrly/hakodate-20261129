name: Hakodate integration selftest
on:
  push:
    paths:
      - ".github/workflows/integration-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Call production Edge selftest
        shell: bash
        run: |
          set -euo pipefail
          resp="$(curl -fsS -X POST -H 'content-type: application/json' -H 'x-selftest-token: hk-selftest-20261010-8f96a2d1' --data '{"action":"selftest"}' 'https://bvmumhpylsllbvhvymns.supabase.co/functions/v1/hakodate-trip-202611')"
          echo "$resp"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True,d; assert d.get("cleanup_ok") is True,d; s=d.get("steps") or []; assert any("state save/get PASS" in x for x in s),s; assert any("jpeg/png/webp storage + metadata + signed URL PASS" in x for x in s),s; assert any("photo list PASS" in x for x in s),s; assert any("caption update PASS" in x for x in s),s; assert any("photo delete PASS" in x for x in s),s' "$resp"
