name: Temporary browser E2E

on:
  push:
    paths:
      - ".github/workflows/browser-e2e-temp.yml"

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build browser test page
        shell: bash
        run: |
          mkdir -p .e2e
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          mock=r'''<script>
          window.__requests=[];
          window.fetch=async function(url,opts={}){
            const body=JSON.parse(opts.body||"{}");
            window.__requests.push({url,body,headers:opts.headers||{}});
            const reply=(obj,status=200)=>Promise.resolve({
              ok:status>=200&&status<300,
              status,
              json:async()=>obj
            });
            if(body.action==="login") return reply({ok:true,token:"TEST-token"});
            if(body.action==="get_state") return reply({ok:true,state:null,updated_at:null});
            if(body.action==="save_state") return reply({ok:true,updated_at:"TEST-stamp"});
            if(body.action==="list_photos") return reply({ok:true,photos:[]});
            if(body.action==="upload_photo") return reply({ok:true,photo:{id:body.id,day:body.day,caption:body.caption||"",data:"data:image/jpeg;base64,/9j/2Q==",created:Date.now()}});
            if(body.action==="update_photo_caption") return reply({ok:true});
            if(body.action==="delete_photo") return reply({ok:true});
            return reply({ok:false,error:"unknown_action"},400);
          };
          </script>'''
          driver=r'''<script>
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const out=[];
            try{
              localStorage.clear();sessionStorage.clear();
              const saveText=[...document.querySelectorAll(".hero-strip b")].map(x=>x.textContent).join("|");
              if(!saveText.includes("CLOUD / 2人共有")) throw Error("SAVE MODE is not CLOUD/shared");
              if(!document.body.textContent.includes("CT-1344256")) throw Error("agreed taxi reservation missing");
              if(!document.body.textContent.includes("ANA NH555")) throw Error("NH555 missing");
              const initialRows=document.querySelectorAll("#sched .row").length;
              if(initialRows<6) throw Error("initial itinerary did not render");

              document.getElementById("pass").value="TEST-日本語";
              document.getElementById("gateForm").requestSubmit();
              await sleep(200);
              if(!document.getElementById("gate").classList.contains("hidden")) throw Error("login gate did not close");

              const before=document.querySelectorAll("#sched .row").length;
              document.getElementById("addRow").click();
              await sleep(50);
              const after=document.querySelectorAll("#sched .row").length;
              if(after!==before+1) throw Error("add schedule row failed");
              out.push("add schedule PASS");

              const tabs=[...document.querySelectorAll(".tab")];
              tabs.find(x=>x.dataset.view==="album").click();
              if(document.getElementById("view-album").classList.contains("hidden")) throw Error("album tab failed");
              tabs.find(x=>x.dataset.view==="info").click();
              if(document.getElementById("view-info").classList.contains("hidden")) throw Error("info tab failed");
              tabs.find(x=>x.dataset.view==="days").click();
              out.push("tabs PASS");

              const png="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl9JH0AAAAASUVORK5CYII=";
              const bytes=Uint8Array.from(atob(png),c=>c.charCodeAt(0));
              const file=new File([bytes],"TEST.png",{type:"image/png"});
              const dt=new DataTransfer();dt.items.add(file);
              const input=document.getElementById("dayFile");
              input.files=dt.files;
              input.dispatchEvent(new Event("change",{bubbles:true}));
              await sleep(500);
              const upload=window.__requests.find(x=>x.body.action==="upload_photo");
              if(!upload) throw Error("photo upload request not emitted");
              if(!String(upload.body.data||"").startsWith("data:image/jpeg;base64,")) throw Error("photo was not converted to JPEG data URL");
              if(upload.headers["x-trip-token"]!=="TEST-token") throw Error("photo upload missing auth token");
              out.push("photo request PASS");

              document.body.dataset.e2eResult="PASS";
              const pre=document.createElement("pre");pre.id="e2e-result";pre.textContent="PASS "+out.join(" / ");document.body.append(pre);
            }catch(e){
              document.body.dataset.e2eResult="FAIL";
              const pre=document.createElement("pre");pre.id="e2e-result";pre.textContent="FAIL "+(e&&e.stack||e);document.body.append(pre);
            }
          })();
          </script>'''
          s=s.replace("<body>","<body>"+mock,1)
          s=s.replace("</body>",driver+"</body>",1)
          Path(".e2e/index.html").write_text(s)
          PY
      - name: Run real headless Chrome interactions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory .e2e >/tmp/hakodate-e2e-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.2
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8765/ > /tmp/hakodate-e2e-dom.html
          grep 'data-e2e-result="PASS"' /tmp/hakodate-e2e-dom.html
          grep 'id="e2e-result">PASS' /tmp/hakodate-e2e-dom.html
